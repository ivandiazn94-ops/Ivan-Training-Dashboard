name: Intervals Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download Athlete
        run: |
          curl -s \
          -u "API_KEY:${{ secrets.INTERVALS_API_KEY }}" \
          "https://intervals.icu/api/v1/athlete/0" \
          > data/athlete.json

      - name: Download Summary
        run: |
          curl -s \
          -u "API_KEY:${{ secrets.INTERVALS_API_KEY }}" \
          "https://intervals.icu/api/v1/athlete/0/athlete-summary.json" \
          > data/summary.json

      - name: Download Activity Detail
        run: |
          curl -s \
          -u "API_KEY:${{ secrets.INTERVALS_API_KEY }}" \
          "https://intervals.icu/api/v1/activity/20928984893" \
          > data/activity-detail.json

      - name: Commit Data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/*.json

          git commit -m "Update Intervals data" || echo "No changes"

          git push
