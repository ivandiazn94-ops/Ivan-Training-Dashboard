name: Intervals Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Activities
        run: |
          mkdir -p data

          curl -s \
          -u "API_KEY:${{ secrets.INTERVALS_API_KEY }}" \
          "https://intervals.icu/api/v1/athlete/i559371/activities?oldest=2026-01-01" \
          > data/activities.json

      - name: Commit Activities
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/activities.json

          git commit -m "Update activities" || echo "No changes"

          git push
