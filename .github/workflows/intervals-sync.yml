name: Intervals Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Summary
        run: |
          mkdir -p data

          curl -s \
          -u "API_KEY:${{ secrets.INTERVALS_API_KEY }}" \
          "https://intervals.icu/api/v1/athlete/0" \
          > data/athlete.json

      - name: Commit Athlete
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/athlete.json

          git commit -m "Update athlete" || echo "No changes"

          git push
