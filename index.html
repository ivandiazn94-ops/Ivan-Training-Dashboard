<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ivan Training Dashboard</title>

<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            🚴 Dashboard
        </div>

        <div class="menu-item" onclick="showPage('summary')">
            📊 Resumen
        </div>

        <div class="menu-item" onclick="showPage('cycling')">
            🚴 Ciclismo
        </div>

        <div class="menu-item" onclick="showPage('hr')">
            ❤️ Pulso
        </div>

        <div class="menu-item" onclick="showPage('load')">
            🔥 Carga
        </div>

    </aside>

    <main class="content">

        <section id="summary" class="page active">

            <h1>Semana Actual</h1>

            <div class="summary-grid">

                <div class="card">
                    <div class="card-title">Distancia</div>
                    <div id="week-km" class="card-value">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Desnivel</div>
                    <div id="week-elevation" class="card-value">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Tiempo</div>
                    <div id="week-time" class="card-value">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Actividades</div>
                    <div id="week-activities" class="card-value">...</div>
                </div>

                <div class="card">
                    <div class="card-title">Load</div>
                    <div id="week-load" class="card-value">...</div>
                </div>

            </div>

            <div class="section">

                <h2>Estado actual</h2>

                <p>Fitness: <b id="fitness"></b></p>

                <p>Fatigue: <b id="fatigue"></b></p>

                <p>Form: <b id="form"></b></p>

                <p id="training-status"></p>

            </div>

            <div class="section">

                <h2>Tiempo en zonas</h2>

                <div id="zones"></div>

            </div>

        </section>

        <section id="cycling" class="page">

            <h1>Ciclismo</h1>

            <div class="summary-grid">

                <div class="card">
                    <div class="card-title">FTP</div>
                    <div id="ftp" class="card-value"></div>
                </div>

                <div class="card">
                    <div class="card-title">Critical Power</div>
                    <div id="cp" class="card-value"></div>
                </div>

                <div class="card">
                    <div class="card-title">W'</div>
                    <div id="wprime" class="card-value"></div>
                </div>

            </div>

        </section>

        <section id="hr" class="page">

            <h1>Pulso</h1>

            <div class="summary-grid">

                <div class="card">
                    <div class="card-title">LTHR</div>
                    <div id="lthr" class="card-value"></div>
                </div>

                <div class="card">
                    <div class="card-title">FC Máxima</div>
                    <div id="maxhr" class="card-value"></div>
                </div>

            </div>

        </section>

        <section id="load" class="page">

            <h1>Carga</h1>

            <div class="section">

                <p>Fitness: <b id="fitness-copy"></b></p>
                <p>Fatigue: <b id="fatigue-copy"></b></p>
                <p>Form: <b id="form-copy"></b></p>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>

</html>
