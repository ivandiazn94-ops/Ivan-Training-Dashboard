<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ivan Training Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Segoe UI,sans-serif;
}

header{
  background:#111827;
  padding:20px;
}

h1{
  margin:0;
}

.container{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.card{
  background:white;
  color:#111827;
  border-radius:16px;
  padding:20px;
}

.label{
  font-size:14px;
  color:#666;
}

.value{
  font-size:34px;
  font-weight:bold;
  color:#2563eb;
  margin-top:8px;
}

.section{
  margin-top:25px;
}

.section h2{
  margin-bottom:15px;
}

.bar{
  background:#1f2937;
  height:36px;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.fill{
  background:#2563eb;
  height:100%;
  display:flex;
  align-items:center;
  padding-left:10px;
  color:white;
  font-weight:bold;
}

.zoneRow{
  margin-bottom:12px;
}

.footer{
  margin-top:30px;
  text-align:center;
  opacity:.7;
}

@media(max-width:768px){

  .grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header>
  <h1>🚴 Ivan Training Dashboard</h1>
</header>

<div class="container">

  <div class="grid">

    <div class="card">
      <div class="label">FTP</div>
      <div id="ftp" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Peso</div>
      <div id="peso" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">W/kg</div>
      <div id="wkg" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Fitness (CTL)</div>
      <div id="fitness" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Fatigue (ATL)</div>
      <div id="fatigue" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Form</div>
      <div id="form" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Actividades</div>
      <div id="count" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Km Semana</div>
      <div id="distance" class="value">...</div>
    </div>

    <div class="card">
      <div class="label">Training Load</div>
      <div id="load" class="value">...</div>
    </div>

  </div>

  <div class="section">

    <h2>⚡ Zonas de Potencia</h2>

    <div id="powerZones"></div>

  </div>

  <div class="section">

    <h2>❤️ Zonas de Frecuencia Cardíaca</h2>

    <div id="hrZones"></div>

  </div>

  <div class="section">

    <h2>📊 Distribución semanal por zonas</h2>

    <div id="weekZones"></div>

  </div>

  <div class="footer">

    Datos obtenidos desde Intervals.icu

  </div>

</div>

<script>

async function loadDashboard(){

  const athlete =
      await fetch('./data/athlete.json')
      .then(r => r.json());

  const summary =
      await fetch('./data/summary.json')
      .then(r => r.json());

  const cycling =
      athlete.sportSettings.find(
          s => s.types.includes("Ride")
      );

  const week = summary[0];

  const ftp = cycling.ftp;
  const weight = athlete.icu_weight;

  document.getElementById('ftp').innerText =
      ftp + " W";

  document.getElementById('peso').innerText =
      weight + " kg";

  document.getElementById('wkg').innerText =
      (ftp/weight).toFixed(2);

  document.getElementById('fitness').innerText =
      week.fitness.toFixed(1);

  document.getElementById('fatigue').innerText =
      week.fatigue.toFixed(1);

  document.getElementById('form').innerText =
      week.form.toFixed(1);

  document.getElementById('count').innerText =
      week.count;

  document.getElementById('distance').innerText =
      (week.distance/1000).toFixed(1);

  document.getElementById('load').innerText =
      week.training_load;

  let powerHtml = '';

  cycling.power_zones.forEach((z,i)=>{

      powerHtml += `
      <div class="zoneRow">
        Z${i+1}
        <div class="bar">
          <div class="fill" style="width:${Math.min(z,100)}%">
            ${z}
          </div>
        </div>
      </div>`;
  });

  document.getElementById('powerZones').innerHTML =
      powerHtml;

  let hrHtml = '';

  cycling.hr_zones.forEach((z,i)=>{

      hrHtml += `
      <div class="zoneRow">
        Z${i+1}
        <div class="bar">
          <div class="fill" style="width:${Math.min(z/2,100)}%">
            ${z} ppm
          </div>
        </div>
      </div>`;
  });

  document.getElementById('hrZones').innerHTML =
      hrHtml;

  const total =
      week.timeInZones.reduce((a,b)=>a+b,0);

  let weekHtml = '';

  week.timeInZones.forEach((z,i)=>{

      const pct =
          ((z/total)*100).toFixed(1);

      weekHtml += `
      <div class="zoneRow">
        Zona ${i+1}
        <div class="bar">
          <div class="fill" style="width:${pct}%">
            ${pct}%
          </div>
        </div>
      </div>`;
  });

  document.getElementById('weekZones').innerHTML =
      weekHtml;

}

loadDashboard();

</script>

</body>
</html>
