<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivan Training Dashboard</title>

<style>

body{
    font-family:Segoe UI,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:white;
    color:#111;
    padding:20px;
    border-radius:16px;
}

.titulo{
    font-size:14px;
    color:#666;
}

.valor{
    margin-top:10px;
    font-size:32px;
    font-weight:bold;
    color:#2563eb;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<h1>🚴 Ivan Training Dashboard</h1>

<div class="grid">

    <div class="card">
        <div class="titulo">FTP</div>
        <div id="ftp" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Peso</div>
        <div id="peso" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">W/kg</div>
        <div id="wkg" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">FC Umbral</div>
        <div id="lthr" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">FC Máxima</div>
        <div id="maxhr" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Fitness (CTL)</div>
        <div id="fitness" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Fatigue (ATL)</div>
        <div id="fatigue" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Form</div>
        <div id="form" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Actividades Semana</div>
        <div id="count" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Km Semana</div>
        <div id="distance" class="valor">...</div>
    </div>

    <div class="card">
        <div class="titulo">Training Load</div>
        <div id="load" class="valor">...</div>
    </div>

</div>

<script>

async function cargarDashboard(){

    try {

        const athleteResponse =
            await fetch('./data/athlete.json');

        const athlete =
            await athleteResponse.json();

        const summaryResponse =
            await fetch('./data/summary.json');

        const summary =
            await summaryResponse.json();

        const cycling =
            athlete.sportSettings.find(
                s => s.types.includes('Ride')
            );

        const ftp = cycling.ftp;
        const peso = athlete.icu_weight;

        document.getElementById('ftp').innerText =
            ftp + " W";

        document.getElementById('peso').innerText =
            peso + " kg";

        document.getElementById('wkg').innerText =
            (ftp / peso).toFixed(2);

        document.getElementById('lthr').innerText =
            cycling.lthr;

        document.getElementById('maxhr').innerText =
            cycling.max_hr;

        const semana = summary[0];

        document.getElementById('fitness').innerText =
            semana.fitness.toFixed(1);

        document.getElementById('fatigue').innerText =
            semana.fatigue.toFixed(1);

        document.getElementById('form').innerText =
            semana.form.toFixed(1);

        document.getElementById('count').innerText =
            semana.count;

        document.getElementById('distance').innerText =
            (semana.distance / 1000).toFixed(1);

        document.getElementById('load').innerText =
            semana.training_load;

    }
    catch(error){

        console.error(error);

        alert(
          "Error cargando datos. Revisa athlete.json y summary.json"
        );

    }

}

cargarDashboard();

</script>

</body>
</html>
