<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Dashboard Ivan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#0f172a;
    color:#fff;
}

.header{
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    padding:22px;
}

.wrap{
    display:flex;
}

.side{
    width:250px;
    background:#111827;
    padding:15px;
    min-height:100vh;
}

.nav{
    background:#1f2937;
    padding:12px;
    border-radius:12px;
    margin:8px 0;
}

.main{
    flex:1;
    padding:20px;
}

.panel,.card{
    background:#fff;
    color:#111;
    border-radius:18px;
    padding:15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
}

.metric{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.box{
    background:#eff6ff;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.sports,
.grid{
    display:grid;
    gap:15px;
}

.sports{
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    margin:15px 0;
}

.grid{
    grid-template-columns:1fr 1fr;
    margin-top:15px;
}

.sport{
    padding:15px;
    border-radius:18px;
    color:white;
}

.bike{
    background:#2563eb;
}

.run{
    background:#16a34a;
}

.gym{
    background:#ea580c;
}
